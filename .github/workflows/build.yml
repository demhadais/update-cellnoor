name: Build download-scbl-excel-workbooks
permissions:
  contents: write
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        working-directory: update-cellnoor
        run: |
          bun install
          bun build --compile --minify --sourcemap --bytecode --format esm index.ts --outfile update-cellnoor

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: update-cellnoor
        run: |
          version=$(jq -r '.version' package.json)
          gh release create update-cellnoor-$version update-cellnoor
